<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart"
    />
    <title>E-commerce</title>
  </head>
  <body>
    <header>
      <div class="prop">
        <h2 id="logo">ShopWithJudy<span id="icon" class="material-symbols-outlined"> shopping_cart </span>
</h2>
        <div class="cart-link">
          <button data-section="cart">
            <span class="material-symbols-outlined"> shopping_cart </span>
          </button>
          <input type="search" placeholder="Search items" />
        </div>
      </div>
      <div class="items-link">
        <button data-section="home" class="active">All</button>
        <button data-section="dress">Dresses</button>
        <button data-section="it">IT Accessories</button>
        <button data-section="shoe">Shoes</button>
        <button data-section="bag">Bags</button>
        <button data-section="utensil">Household Utensils</button>
        <button data-section="beauty">Beauty</button>
        <button data-section="jewelry">Jewelry</button>
      </div>
    </header>

    <div class="container">
      <section class="recent">
        <h2>Recently Viewed Items</h2>
        <div id="recent"></div>
      </section>

      <section class="items">
        <div id="items-con">
          <section class="section" id="home"></section>
          <section class="section" id="dress" hidden></section>
          <section class="section" id="shoe" hidden></section>
          <section class="section" id="it" hidden></section>
          <section class="section" id="bag" hidden></section>
          <section class="section" id="utensil" hidden></section>
          <section class="section" id="beauty" hidden></section>
          <section class="section" id="jewelry" hidden></section>
          <section class="section" id="search-results" hidden></section>
        </div>
      </section>

      <section id="modal">
        <dialog hidden>
          <button id="close-modal">✕</button>
          <div id="modal-content"></div>
        </dialog>
      </section>

      <section class="carts" hidden>
       <aside>
        <div class ="group">
              <h2>Your Carts</h2>
            <button id="close-cart">
            <span class="material-symbols-outlined"> shopping_cart </span>
          </button>
        </div>
    <div id="cart"></div> 
    <p id="cart-total"></p>
</aside>
      </section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
